<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="st.title">El Cuento - Misiones Olvidadas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="9" fill="#0b3d91"/><ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#fc3d21" stroke-width="2.5" transform="rotate(-25 20 20)"/><circle cx="34" cy="12" r="3" fill="#fff"/></svg>
        <span class="logo-text"><span data-i18n="brand.a">MISIONES</span><small data-i18n="brand.b">OLVIDADAS</small></span>
      </a>
      <nav class="nav-menu">
        <a href="index.html" class="nav-btn" data-i18n="nav.home">Inicio</a>
        <a href="cuento.html" class="nav-btn active" data-i18n="nav.story">El Cuento</a>
        <a href="juegos.html" class="nav-btn" data-i18n="nav.games">Juegos</a>
      </nav>
      <div class="header-tools">
        <div class="pts-chip" data-i18n-attr="title:pts.title" title="Puntos acumulados en todos los juegos">⭐ <span data-puntos-global>0</span> <em>PTS</em></div>
      </div>
    </div>
  </header>

  <main class="content-container">
    <div class="card">
      <span class="eyebrow" data-i18n="st.eyebrow">Historia interactiva</span>
      <h2 data-i18n="st.h2">La Aventura del Rover Solitario</h2>
      <div id="story-container" class="story-box">
        <p id="story-text"></p>
        <div id="story-choices" class="story-controls"></div>
      </div>
    </div>
  </main>

  <footer class="main-footer">
    <p data-i18n-html="footer.project">Proyecto desarrollado para el <strong>NASA Space Apps Challenge</strong> 🚀</p>
    <p><span data-i18n="footer.team">Creado por el equipo:</span> <span class="team-name">Tu Nombre / Nombre de tu Equipo</span></p>
  </footer>

  <script src="idioma.js"></script>
  <script src="puntos.js"></script>
  <script src="cuento.js"></script>
</body>
</html>
