<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro de Control NASA: misiones</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens y base ===== */
:root{color-scheme:dark;--bg:#080d26;--pn:#131b46;--pn2:#212c68;--ink:#f4f1ff;--mute:#a9b2e8;--sun:#ffc93c;--cor:#ff6b6b;--teal:#2ee6c5;--vio:#8b6bff;--ok:#3ddc84;--bad:#ff4d5e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#2a3490 0,var(--bg) 55%);color:var(--ink);font:18px/1.3 "Baloo 2","Trebuchet MS",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
h1{font-size:clamp(28px,6vw,44px);margin:4px 0;font-weight:800}h2{font-size:clamp(21px,4.5vw,30px);margin:4px 0;font-weight:800}
p{margin:5px 0}.sub{color:var(--mute)}.hide{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
/* Paneles metálicos con tornillos */
.panel{position:relative;background:linear-gradient(160deg,var(--pn2),var(--pn));border:3px solid #3a4690;border-radius:20px;padding:12px;box-shadow:inset 0 0 0 2px #0b1030,0 6px 18px #0006}
.panel h3{margin:0 0 8px;font-size:20px}
.mcard{background:var(--pn);border:3px solid var(--pn2);border-radius:22px;padding:16px;text-align:left;transition:.15s}
.mcard:hover{transform:translateY(-3px);border-color:var(--sun)}.mcard .big{font-size:54px;line-height:1}.mcard b{display:block;font-size:24px}
.tag{background:var(--vio);border-radius:99px;padding:1px 12px;font-size:15px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:#0e1538;border:3px solid transparent;border-radius:14px;padding:8px 10px;margin-bottom:8px;min-height:62px}
.opt:hover{border-color:var(--mute)}.opt.sel{border-color:var(--sun);background:#343b8c}.opt small{display:block;color:var(--mute);font-size:14px;line-height:1.15}
.bar{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;margin:5px 0}
.trk{height:16px;background:#050820;border-radius:99px;border:2px solid #2c3677;overflow:hidden}.fl{height:100%;width:0;border-radius:99px;transition:width .15s,background .2s}
.hint{background:#3b2a58;border-left:8px solid var(--sun);border-radius:12px;padding:6px 10px;margin:7px 0}.hint.good{background:#12473a;border-color:var(--ok)}
.hint.warn{background:#5a1a2a;border-color:var(--bad);animation:blink .8s infinite}
@keyframes blink{50%{opacity:.55}}
.btn{background:linear-gradient(#ffd75e,var(--sun));color:#2b2100;font-weight:800;font-size:23px;border-radius:18px;padding:12px 24px;min-height:60px;box-shadow:0 6px 0 #b98a00}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b98a00}.btn:disabled{background:#4a5090;color:#9aa1d8;box-shadow:0 6px 0 #2b3170;cursor:not-allowed}
.ghost{background:var(--pn2);border-radius:14px;padding:8px 16px;font-weight:700;min-height:46px}
/* ===== Cabina ===== */
.cockpit{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:12px;align-items:start}
@media(max-width:860px){.cockpit{grid-template-columns:1fr}}
.cvwrap{position:relative;max-width:420px;margin:0 auto}
canvas{display:block;width:100%;aspect-ratio:400/560;max-height:62vh;border-radius:18px;border:4px solid #3a4690;background:#000;touch-action:none;margin:0 auto}
.alert{position:absolute;left:8px;right:8px;top:8px;background:#7a1020ee;border:3px solid var(--bad);border-radius:12px;padding:4px 10px;text-align:center;font-weight:800;animation:blink .5s infinite}
.alert.info{background:#7a4a00ee;border-color:var(--sun)}
#toast{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:26px;font-weight:800;color:var(--sun);text-shadow:0 2px 8px #000;pointer-events:none;opacity:0}
#toast.go{animation:tst 2.2s}@keyframes tst{0%{opacity:0;transform:scale(.7)}12%,75%{opacity:1;transform:scale(1)}100%{opacity:0}}
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;max-width:420px;margin:10px auto 0}
.ctl button{background:var(--pn2);border:3px solid #4a57b5;border-radius:18px;min-height:68px;font-size:22px;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:none}
.ctl button.on{background:var(--cor);transform:translateY(3px)}.ctl .acc{background:#2a6a4a}
.leds{display:flex;gap:10px;flex-wrap:wrap}.leds span{display:flex;align-items:center;gap:5px;font-size:15px}
.led{width:14px;height:14px;border-radius:50%;background:#333;box-shadow:inset 0 0 3px #000}
.led.g{background:var(--ok);box-shadow:0 0 10px var(--ok)}.led.a{background:var(--sun);box-shadow:0 0 10px var(--sun)}.led.r{background:var(--bad);box-shadow:0 0 12px var(--bad);animation:blink .5s infinite}
#rad{border-radius:50%;border:3px solid #3a4690;width:104px;height:104px}
.spd{text-align:center;border:3px solid var(--ok);background:#12473a;border-radius:16px;padding:4px;margin:8px 0;transition:.2s}
.spd.bad{border-color:var(--bad);background:#5a1a2a}.spd b{font-size:30px}.spd span{display:block;font-size:14px;color:var(--mute);line-height:1}
.chip{display:inline-block;background:#0e1538;border-radius:12px;padding:4px 10px;margin:3px}
/* ===== Reporte NASA ===== */
#rep{position:fixed;inset:0;background:#040618e6;overflow:auto;padding:14px;z-index:9}
.card{max-width:680px;margin:0 auto;background:var(--pn);border:4px solid var(--sun);border-radius:24px;padding:16px}
.card h3{color:var(--sun);margin:12px 0 4px;font-size:20px}.stars{font-size:36px;letter-spacing:4px}
.cb{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.cb .fl{background:linear-gradient(90deg,var(--teal),var(--vio))}
#mute{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;width:52px;height:52px;border-radius:50%;background:var(--pn2);font-size:24px}
@media(prefers-reduced-motion:reduce){.alert,.led.r,.hint.warn{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<section id="s-pick"><h1>🛰️ Centro de Control NASA</h1><p class="sub">Elige una misión real, ensambla tu cohete y pilótalo hasta su destino.</p><div class="grid g3" id="missions"></div></section>

<section id="s-build" class="hide">
 <div class="row"><h2 id="b-title"></h2><button class="ghost" id="b-back">⬅ Cambiar misión</button></div>
 <p class="sub" id="b-goal"></p>
 <div class="panel" style="margin-bottom:10px">
  <div class="bar"><span>Peso</span><div class="trk"><div class="fl" id="f-w" style="background:var(--cor)"></div></div><b id="n-w">0</b></div>
  <div class="bar"><span>Potencia</span><div class="trk"><div class="fl" id="f-p" style="background:var(--teal)"></div></div><b id="n-p">0</b></div>
  <div class="bar"><span>Potencia/peso</span><div class="trk"><div class="fl" id="f-r"></div></div><b id="n-r">0</b></div>
 </div>
 <div class="grid g4" id="mods"></div><div id="hints"></div>
 <div class="row" style="margin-top:8px"><span class="sub" id="b-status"></span><button class="btn" id="launch" disabled>🚀 ¡Despegar!</button></div>
</section>

<section id="s-fly" class="hide"><div class="cockpit">
 <div>
  <div class="row"><b id="phase" style="font-size:20px"></b><button class="ghost" id="f-back">⬅ Salir</button></div>
  <div class="cvwrap"><canvas id="cv" width="400" height="560" aria-label="Pantalla de vuelo"></canvas><div id="alert" class="alert hide"></div><div id="toast"></div></div>
  <div class="ctl">
   <button data-k="L" id="bL">◀</button><button data-k="R" id="bR">▶</button>
   <button data-k="brk">⏬ Frenar</button><button data-k="acc" class="acc">⏫ Acelerar</button>
  </div>
  <p class="sub" style="text-align:center;font-size:15px" id="keys"></p>
 </div>
 <div class="panel">
  <div class="row" style="justify-content:flex-start"><canvas id="rad" width="104" height="104"></canvas>
   <div class="leds"><span><i class="led" id="ld-m"></i>Motor</span><span><i class="led g" id="ld-e"></i><span id="pw">Energía</span></span><span><i class="led" id="ld-a"></i>Alerta</span><span><i class="led" id="ld-s"></i>Etapa 1</span></div></div>
  <div class="spd" id="spd"><span>Velocidad</span><b id="v-spd">0</b></div>
  <div id="met"></div>
 </div>
</div></section>
<div id="rep" class="hide"></div>
</div>
<button id="mute" aria-label="Sonido">🔊</button>

<script>
"use strict";
/* ===== Utilidades ===== */
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const mix=(a,b,t)=>"rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(",")+")";
const show=id=>{["pick","build","fly"].forEach(k=>$("#s-"+k).classList.toggle("hide",k!==id));$("#rep").classList.add("hide");scrollTo(0,0)};

/* ===== Datos: módulos del cohete (w = peso, thr = empuje) ===== */
const MODS={
 engine:{t:"1 · Fase inferior (motor)",items:[
  {id:"saturn",ic:"🚀",n:"Cohete Saturno V",d:"Muchísima potencia, pesado",w:90,thr:300,fuel:100,ramp:3},
  {id:"liquid",ic:"⛽",n:"Motor de combustible líquido",d:"Balanceado",w:60,thr:210,fuel:100,ramp:3},
  {id:"ion",ic:"✨",n:"Propulsor iónico",d:"Ligero, acelera poco a poco",w:25,thr:115,fuel:150,ramp:.7}]},
 payload:{t:"2 · Fase superior (carga)",items:[
  {id:"apollo",ic:"🚙",n:"Rover Apollo 15",d:"Vehículo lunar",w:40},
  {id:"mars",ic:"🤖",n:"Rovers gemelos Spirit/Opportunity",d:"Robots geólogos",w:30},
  {id:"pioneer",ic:"📡",n:"Sonda Pioneer 10",d:"Antena para el espacio lejano",w:25}]},
 power:{t:"3 · Sistema de energía",items:[
  {id:"cell",ic:"🔋",n:"Celdas de combustible",d:"Energía para pocos días",w:20},
  {id:"solar",ic:"☀️",n:"Paneles solares extensibles",d:"Energía del Sol",w:15},
  {id:"rtg",ic:"☢️",n:"Generador nuclear (RTG)",d:"Calor que se vuelve electricidad",w:25}]},
 guard:{t:"4 · Aterrizaje / protección",items:[
  {id:"retro",ic:"🔻",n:"Retrofrenos computarizados",d:"Cohetes que frenan la caída",w:20},
  {id:"bags",ic:"🎈",n:"Airbags + paracaídas",d:"Amortiguan el golpe",w:25},
  {id:"shield",ic:"🛡️",n:"Escudo térmico y anti-impactos",d:"Aguanta calor y rocas",w:25}]}
};
const find=(k,id)=>MODS[k].items.find(i=>i.id===id);
const MISSIONS=[
{id:"moon",emoji:"🌕",name:"Apollo 15",dest:"la Luna",
 goal:"Lleva el primer vehículo lunar a la superficie. En la Luna no hay aire: solo los cohetes pueden frenarte.",
 ok:{payload:"apollo",power:"cell",guard:"retro"},
 hints:{mars:"Esos rovers son para Marte. Apollo 15 lleva su propio vehículo lunar.",pioneer:"Pioneer 10 es una sonda para el espacio lejano, no un rover.",solar:"Los paneles no hacen falta: la misión dura solo unos días.",rtg:"El RTG es para misiones de años, muy lejos del Sol.",bags:"En la Luna no hay aire, así que paracaídas y airbags no frenan. Usa retrofrenos.",shield:"Rumbo a la Luna no hay asteroides ni atmósfera. Necesitas frenar con retrofrenos."},
 logi:"El motor da la fuerza para salir de la Tierra. En la Luna no hay atmósfera: solo los retrofrenos pueden frenar el módulo. Las celdas de energía bastan para una misión de pocos días.",
 date:"Julio–agosto de 1971",
 facts:[["Km con el rover",27.9,30,"27.9 km"],["Kg de rocas traídas",77,100,"77 kg"],["Horas caminando",18.5,30,"18.5 h"]],
 why:"El rover se quedó en la Luna: la cabina de regreso era pequeñita y debía cargar a los astronautas y 77 kg de rocas. Dejarlo ahorró peso. Todavía está estacionado cerca de los Apeninos lunares."},
{id:"mars",emoji:"🔴",name:"Spirit y Opportunity",dest:"Marte",
 goal:"Aterriza dos rovers solares. Entrarás muy rápido a la atmósfera: se pone al rojo vivo, abre el paracaídas y rebota en airbags.",
 ok:{payload:"mars",power:"solar",guard:"bags"},
 hints:{apollo:"Ese rover es lunar. Marte necesita los rovers gemelos.",pioneer:"Pioneer 10 es una sonda que pasa de largo, no aterriza.",cell:"Las celdas gastan combustible y los rovers deben trabajar meses. En Marte hay Sol.",rtg:"Un RTG pesa mucho para rovers pequeños y en Marte sí llega luz solar.",retro:"Los retrofrenos gastan muchísimo combustible. Marte tiene aire: usa airbags y paracaídas.",shield:"El calor se aguanta con el casco de entrada, pero para tocar suelo necesitas airbags."},
 logi:"Al entrar a Marte, la fricción con el aire calienta la nave y la frena. Luego un paracaídas y los airbags amortiguan el golpe sin gastar combustible. Los paneles solares dan energía cada día.",
 date:"Enero de 2004",
 facts:[["Días planeados",90,5200,"90 soles"],["Spirit trabajó",2210,5200,"2,210 soles"],["Opportunity trabajó",5111,5200,"5,111 soles"]],
 why:"Spirit quedó atorado en arena suave y dejó de comunicarse en 2010. Opportunity trabajó hasta 2018, cuando una tormenta de polvo tapó sus paneles solares. Nadie podía ir a limpiarlos ni a repararlos: se quedaron en Marte como estaciones científicas."},
{id:"pioneer",emoji:"🌌",name:"Pioneer 10",dest:"el espacio profundo",
 goal:"Cruza el cinturón de asteroides y acelera hasta la velocidad de escape del Sistema Solar. ¡Allá lejos casi no hay luz!",
 ok:{payload:"pioneer",power:"rtg",guard:"shield"},
 hints:{apollo:"Ese rover es para la Luna. Aquí va una sonda.",mars:"Esos robots son para Marte. Aquí va una sonda para el espacio lejano.",cell:"Las celdas se agotarían pronto y el viaje dura años.",solar:"¡Allá lejos el Sol casi no brilla! Los paneles no darían energía.",retro:"Pioneer 10 no aterriza: pasa de largo. Necesita protección.",bags:"No hay suelo donde rebotar. Elige protección contra las rocas."},
 logi:"El impulsor te saca de la Tierra y te da velocidad. El RTG convierte el calor del plutonio en electricidad sin necesitar luz. El escudo protege la sonda de las rocas del cinturón.",
 date:"Marzo de 1972",
 facts:[["Años con señal",31,35,"31 años"],["Distancia (Tierra–Sol = 1)",80,100,"80 veces"],["Velocidad (km/s)",12,20,"12 km/s"]],
 why:"Pioneer 10 no puede frenar: en el espacio no hay nada que la detenga. Su última señal llegó el 23 de enero de 2003, cuando su energía ya era muy débil, pero sigue viajando hacia las estrellas."}
];

/* ===== Pantalla de selección y ensamblaje ===== */
let M=null,sel={},G=null,raf=0,last=0,muted=false;
$("#missions").innerHTML=MISSIONS.map((m,i)=>`<button class="mcard" data-i="${i}"><span class="big">${m.emoji}</span><b>${m.name}</b><span class="tag">${m.dest}</span><p class="sub">${m.goal.split(".")[0]}.</p></button>`).join("");
document.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{M=MISSIONS[b.dataset.i];sel={};renderBuild();show("build")});
function stats(){let w=0;for(const k in sel)w+=find(k,sel[k]).w;const e=sel.engine?find("engine",sel.engine):null;return{w,thr:e?e.thr:0,twr:e&&w?e.thr/w:0}}
function renderBuild(){
 $("#b-title").textContent=M.emoji+" "+M.name+": viaje a "+M.dest;$("#b-goal").textContent=M.goal;
 $("#mods").innerHTML=Object.keys(MODS).map(k=>`<div class="panel"><h3>${MODS[k].t}</h3>${MODS[k].items.map(i=>`<button class="opt ${sel[k]===i.id?"sel":""}" data-k="${k}" data-id="${i.id}"><b>${i.ic} ${i.n}</b><small>${i.d} · Peso ${i.w}</small></button>`).join("")}</div>`).join("");
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{sel[b.dataset.k]=b.dataset.id;renderBuild()});
 const S=stats(),all=Object.keys(sel).length===4;
 $("#f-w").style.width=Math.min(100,S.w/250*100)+"%";$("#n-w").textContent=S.w;
 $("#f-p").style.width=Math.min(100,S.thr/300*100)+"%";$("#n-p").textContent=S.thr;
 const rc=S.twr<1.15?"var(--bad)":S.twr<1.4?"var(--sun)":"var(--ok)";
 $("#f-r").style.width=Math.min(100,S.twr/2*100)+"%";$("#f-r").style.background=rc;$("#n-r").textContent=S.twr.toFixed(2);
 let hs=[],wrong=0;
 for(const k of["payload","power","guard"])if(sel[k]&&sel[k]!==M.ok[k]){wrong++;hs.push(`<div class="hint">💡 <b>${find(k,sel[k]).n}:</b> ${M.hints[sel[k]]}</div>`)}
 const lowTwr=all&&S.twr<1.15;
 if(lowTwr)hs.push(`<div class="hint warn">⚠️ <b>¡El peso supera la potencia del motor!</b> Con este motor no despegarías. Elige un motor más fuerte o una carga más ligera.</div>`);
 const ready=all&&!wrong&&!lowTwr;
 if(ready)hs.push(`<div class="hint good">✅ ¡Cohete listo! Piezas perfectas para esta misión.</div>`);
 $("#hints").innerHTML=hs.join("");$("#launch").disabled=!ready;
 $("#b-status").textContent=all?"":"Elige una pieza en cada columna.";
}
$("#b-back").onclick=()=>show("pick");$("#launch").onclick=()=>startFlight();

/* ===== Sonido (WebAudio, sin archivos) ===== */
let AC=null,ng=null,nf=null;
function snd(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const s=AC.createBufferSource();s.buffer=b;s.loop=true;nf=AC.createBiquadFilter();nf.type="lowpass";ng=AC.createGain();ng.gain.value=0;s.connect(nf);nf.connect(ng);ng.connect(AC.destination);s.start()}catch(e){AC=null}}
function tone(f,d,type,v,f2){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||"square";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
$("#mute").onclick=()=>{muted=!muted;$("#mute").textContent=muted?"🔇":"🔊";if(ng)ng.gain.value=0};

/* ===== Entradas: teclado y botones táctiles ===== */
const K={acc:0,brk:0,L:0,R:0},KM={Space:"acc",ArrowUp:"acc",KeyW:"acc",ArrowDown:"brk",KeyS:"brk",ShiftLeft:"brk",ArrowLeft:"L",KeyA:"L",ArrowRight:"R",KeyD:"R"};
addEventListener("keydown",e=>{if(KM[e.code]&&G&&!$("#s-fly").classList.contains("hide")){e.preventDefault();K[KM[e.code]]=1}});
addEventListener("keyup",e=>{if(KM[e.code])K[KM[e.code]]=0});
document.querySelectorAll(".ctl button").forEach(b=>{const k=b.dataset.k,s=v=>{K[k]=v;b.classList.toggle("on",!!v)};
 b.addEventListener("pointerdown",e=>{e.preventDefault();snd();s(1)});["pointerup","pointerleave","pointercancel"].forEach(t=>b.addEventListener(t,()=>s(0)));b.addEventListener("contextmenu",e=>e.preventDefault())});

/* ===== Instrumentos (HUD) ===== */
const MET=[["fuel","Combustible","#3ddc84"],["thr","Empuje","#ffc93c"],["alt","Altitud","#2ee6c5"],["gf","Velocidad G","#ff8a2b"],["ang","Inclinación","#8b6bff"],["tmp","Temp. compuerta","#ff6b6b"]];
$("#met").innerHTML=MET.map(m=>`<div class="bar"><span id="l-${m[0]}">${m[1]}</span><div class="trk"><div class="fl" id="b-${m[0]}" style="background:${m[2]}"></div></div><b id="t-${m[0]}" style="font-size:15px">0</b></div>`).join("");
function setM(id,f,txt,col){const b=$("#b-"+id);b.style.width=clamp(f,0,1)*100+"%";if(col)b.style.background=col;$("#t-"+id).textContent=txt}
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.remove("go");void e.offsetWidth;e.classList.add("go")};

/* ===== Simulación ===== */
const W=400,H=560,GE=9,VESC=13,cv=$("#cv"),ctx=cv.getContext("2d"),rad=$("#rad").getContext("2d"),stars=Array.from({length:90},()=>[rnd(0,W),rnd(0,H),rnd(.5,2)]);
function startFlight(){
 snd();const S=stats(),e=find("engine",sel.engine);

 if(!(G.done&&!G.ok&&G.t>0&&G.explode))rocket(rx,ry,p==="belt"?0:rr,p==="belt"?.8:p==="land"?1.15:1.5,!G.sep);
 if(p==="land"&&G.bags){const a=clamp((20-G.alt)/6,0,1);ctx.fillStyle="rgba(255,255,255,.8)";ctx.beginPath();ctx.arc(rx,ry+8,40*a+4,0,7);ctx.fill();ctx.strokeStyle="#aaa";ctx.lineWidth=3;ctx.stroke()}
 for(const q of G.P){const t=q.l/q.L;ctx.globalAlpha=clamp(t,0,1)*(q.k==="smoke"?.45:.9);ctx.fillStyle=q.k==="fire"?mix([255,90,20],[255,235,110],t):q.k==="smoke"?"#aaa":q.k==="puff"?"#fff":"#ffd27a";ctx.beginPath();ctx.arc(q.x,q.y,q.s*(q.k==="smoke"?2-t:t+.3),0,7);ctx.fill()}
 ctx.globalAlpha=1;
 if(G.flash>0){ctx.fillStyle="rgba(255,77,94,.25)";ctx.fillRect(0,0,W,H)}
 if(G.fade>0){ctx.fillStyle="rgba(0,0,0,"+clamp(G.fade,0,1)+")";ctx.fillRect(0,0,W,H)}
}

/* ===== Reporte de misión ===== */
function report(ok,msg){
 const pct=Math.round(G.fuel/G.fuelMax*100),st=ok?(G.ph==="belt"?clamp(G.sh,1,3):pct>=50?3:pct>=25?2:1):0;
 $("#rep").innerHTML=ok?`<div class="card"><div class="row"><b>📡 Reporte de misión NASA</b><span class="tag">${M.date}</span></div>
 <h2>${M.emoji} ¡Misión cumplida: ${M.name}!</h2><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
 <span class="chip">⛽ Combustible final: ${Math.max(0,pct)}%</span><span class="chip">🌀 Máx. ${G.maxG.toFixed(1)} G</span><span class="chip">⏱ ${G.t.toFixed(0)} s</span>
 <h3>Datos reales de la misión</h3>${M.facts.map(f=>`<div class="cb"><span>${f[0]}</span><div class="trk"><div class="fl" style="width:${f[1]/f[2]*100}%"></div></div><b>${f[3]}</b></div>`).join("")}
 <h3>¿Cómo funcionó tu logística?</h3><p>${M.logi}</p><h3>¿Por qué se quedó allá?</h3><p>${M.why}</p>
 <div class="row" style="margin-top:12px"><button class="btn" id="r-next">Otra misión</button><button class="ghost" id="r-again">Volar de nuevo</button></div></div>`
 :`<div class="card" style="border-color:var(--cor)"><h2>💥 ¡Casi lo logras!</h2><p>${msg}</p><div class="row" style="margin-top:12px"><button class="btn" id="r-again">Intentar de nuevo</button><button class="ghost" id="r-edit">Cambiar piezas</button><button class="ghost" id="r-next">Otra misión</button></div></div>`;
 $("#rep").classList.remove("hide");
 $("#r-next").onclick=()=>show("pick");$("#r-again").onclick=startFlight;if($("#r-edit"))$("#r-edit").onclick=()=>show("build");
}
$("#f-back").onclick=()=>{if(G){G.done=true;G.P=[]}if(ng)ng.gain.value=0;show("build")};
</script>
</body>
